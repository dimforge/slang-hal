[package]
name = "slang-hal"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
description = "Abstractions for running Slang shaders with Rust."
repository = "https://github.com/dimforge/slang-hal"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["webgpu"]
runtime = ["minislang"]
derive = ["slang-hal-derive"]
comptime = ["slang-hal-derive", "slang-hal-derive/comptime", "slang-hal-build", "include_dir"]
webgpu = ["slang-hal-derive?/webgpu"]
cuda = ["cudarc", "slang-hal-derive?/cuda"]
cublas = [ "cudarc?/cublas"]
vulkan = ["ash", "slang-hal-derive?/vulkan"]
metal = ["dep:metal", "slang-hal-derive?/metal"]
cpu = ["libloading", "uuid", "rayon", "slang-hal-derive?/cpu"]

[dependencies]
nalgebra = { workspace = true }
wgpu = { workspace = true, features = ["wgsl"] }
encase = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
thiserror = { workspace = true }
smallvec = "1"
futures = { workspace = true }
async-trait = "0.1"
include_dir = "0.7"

minislang = { version = "0.2", path = "../minislang", optional = true }
slang-hal-derive = { version = "0.2", path = "../slang-hal-derive", optional = true }
dashmap = "5"
regex = "1"
bitflags = "2"

# For test_shader_compilation
paste = "1"

# CUDA runtime
cudarc = { version = "0.16", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-version-from-build-system"], optional = true }
log = "0.4.27"

# Vulkan runtime
ash = { version = "0.38", optional = true }

# Metal runtime
metal = { version = "0.32", optional = true }

# CPU runtime
libloading = { version = "0.8", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
nalgebra = "0.34"
futures-test = "0.3"
serial_test = "3"
approx = "0.5"
async-std = { version = "1", features = ["attributes"] }
slang-hal = { path = ".", features = ["derive"], default-features = false }

[build-dependencies]
dircpy = "0.3"
slang-hal-build = { version = "0.2", path = "../slang-hal-build", optional = true }
include_dir = { version = "0.7", optional = true }